name: Build SkyStrike v26.3.10-M11 Weapons Android APK

on:
  push:
    branches: [main]
    paths:
      - 'SkyStrike-v26_3_10-M11-weapons.zip'
      - '.github/workflows/build-skystrike-v26-3-10-m11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract M11 archive
        run: |
          set -euo pipefail
          ARCHIVE="SkyStrike-v26_3_10-M11-weapons.zip"
          test -s "$ARCHIVE"
          echo "Archive size:"
          stat -c '%s bytes' "$ARCHIVE"
          sha256sum "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p /tmp/skystrike-m11-source
          unzip -q "$ARCHIVE" -d /tmp/skystrike-m11-source
          PROJECT_DIR="$(find /tmp/skystrike-m11-source -type f -name package.json -print -quit | xargs -r dirname)"
          if [[ -z "$PROJECT_DIR" || ! -s "$PROJECT_DIR/package.json" ]]; then
            echo "ERROR: package.json not found in M11 archive."
            find /tmp/skystrike-m11-source -maxdepth 5 -type f | head -200
            exit 1
          fi
          echo "Detected project: $PROJECT_DIR"
          cat "$PROJECT_DIR/package.json"
          mkdir -p "$GITHUB_WORKSPACE/skystrike-build"
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE/skystrike-build"/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and build web assets
        working-directory: skystrike-build
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Verify Capacitor configuration and web output
        working-directory: skystrike-build
        run: |
          set -euo pipefail
          if [[ -f capacitor.config.json ]]; then
            WEB_DIR="$(node -e "const c=require('./capacitor.config.json'); process.stdout.write(c.webDir || 'www')")"
          elif [[ -f capacitor.config.ts || -f capacitor.config.js ]]; then
            echo "Capacitor config found in JS/TS format."
            WEB_DIR="www"
          else
            echo "ERROR: Capacitor configuration not found"
            find . -maxdepth 2 -type f | head -200
            exit 1
          fi
          if [[ ! -d "$WEB_DIR" ]]; then
            echo "ERROR: Capacitor webDir '$WEB_DIR' was not generated."
            find . -maxdepth 3 -type d | head -100
            exit 1
          fi

      - name: Generate Android project
        working-directory: skystrike-build
        run: npx cap add android

      - name: Sync and build APK
        working-directory: skystrike-build
        run: |
          set -euo pipefail
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK="skystrike-build/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyStrike-v26_3_10-M11-weapons-debug-APK
          path: skystrike-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
