name: Compare IRON FRONT 0.9 changes against 0.8
on:
  push:
    paths:
      - '.github/workflows/iron-front-inspect.yml'
      - 'IRON-FRONT-0.9-SOURCE.zip'
      - 'IRON-FRONT-0.8-Ready.zip'
  workflow_dispatch:
jobs:
  compare-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compare source trees and identify control changes
        run: |
          set -euo pipefail
          mkdir -p inspection/v08 inspection/v09
          unzip -q IRON-FRONT-0.8-Ready.zip -d inspection/v08
          unzip -q IRON-FRONT-0.9-SOURCE.zip -d inspection/v09
          BASE="inspection/v08/IRON-FRONT-0.8/SOURCE"
          NEW="inspection/v09"
          test -d "$BASE"
          test -f "$NEW/package.json"
          {
            echo "IRON FRONT 0.9 vs 0.8 SOURCE COMPARISON"
            echo "0.8 source root: $BASE"
            echo "0.9 source root: $NEW"
            echo
            echo "=== CHANGE DOCUMENTS ==="
            for f in CHANGES-0.9.md TEST-REPORT.md FEATURE-STATUS.md progress.md; do
              if [ -f "$NEW/$f" ]; then
                echo "--- $f ---"
                sed -n '1,240p' "$NEW/$f"
              fi
            done
            echo
            echo "=== FILE STATUS (A=added, D=removed, M=modified) ==="
            diff -qr "$BASE" "$NEW" || true
            echo
            echo "=== CONTENT DIFFS FOR GAME / INPUT / UI FILES ==="
            find "$NEW/src" -type f | sort | while read -r f; do
              rel="${f#$NEW/}"
              old="$BASE/$rel"
              if [ -f "$old" ] && ! cmp -s "$old" "$f"; then
                case "$rel" in
                  src/App.tsx|src/style.css|src/game/*)
                    echo "--- DIFF $rel ---"
                    diff -u "$old" "$f" || true
                    ;;
                esac
              elif [ ! -f "$old" ]; then
                echo "--- NEW FILE $rel ---"
                sed -n '1,220p' "$f"
              fi
            done
            echo
            echo "=== PACKAGE CONFIG COMPARISON ==="
            diff -u "$BASE/package.json" "$NEW/package.json" || true
            echo
            echo "=== 0.8 AND 0.9 ROOT STRUCTURE ==="
            find "$BASE" -maxdepth 2 -type f | sort
            echo "--- 0.9 ---"
            find "$NEW" -maxdepth 2 -type f | sort
          } > inspection/merge-analysis.txt
          echo "Comparison generated."
          sed -n '1,260p' inspection/merge-analysis.txt
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-0.9-Merge-Analysis
          path: inspection/merge-analysis.txt
          if-no-files-found: error
          retention-days: 14
