name: Build IRON FRONT APK
on:
  push:
    paths:
      - '.github/workflows/iron-front-inspect.yml'
      - 'IRON-FRONT-0.4-Ready.zip'
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: /tmp/iron-front/IRON-FRONT-0.4/SOURCE/package-lock.json
      - name: Extract IRON FRONT source
        run: |
          mkdir -p /tmp/iron-front
          unzip -q "IRON-FRONT-0.4-Ready.zip" -d /tmp/iron-front
          echo "PROJECT_DIR=$RUNNER_TEMP/iron-front/IRON-FRONT-0.4/SOURCE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/iron-front"
          cp -a /tmp/iron-front/IRON-FRONT-0.4 "$RUNNER_TEMP/iron-front/"
      - name: Install web dependencies and build
        working-directory: ${{ runner.temp }}/iron-front/IRON-FRONT-0.4/SOURCE
        run: |
          npm ci
          npm run build
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Package web game as Android app
        working-directory: ${{ runner.temp }}/iron-front/IRON-FRONT-0.4/SOURCE
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "IRON FRONT" "com.yarubdoktor.ironfront" --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-0.4-Android-APK
          path: ${{ runner.temp }}/iron-front/IRON-FRONT-0.4/SOURCE/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
