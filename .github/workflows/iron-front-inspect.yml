name: Build IRON FRONT 0.11 Visual APK
on:
  push:
    paths:
      - '.github/workflows/iron-front-inspect.yml'
      - 'IRON-FRONT-0.9-SOURCE.zip'
      - 'COMBAT-0.10-PATCH.diff'
      - 'VISUAL-0.11-PATCH.diff'
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract original 0.9 source only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iron-front-09"
          unzip -t "IRON-FRONT-0.9-SOURCE.zip"
          unzip -q "IRON-FRONT-0.9-SOURCE.zip" -d "$RUNNER_TEMP/iron-front-09"
          PACKAGE_JSON="$(find "$RUNNER_TEMP/iron-front-09" -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo 'ERROR: package.json not found in 0.9 source archive'
            find "$RUNNER_TEMP/iron-front-09" -maxdepth 4 -type f | head -n 120
            exit 1
          fi
          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Building from untouched 0.9 source: $SOURCE_DIR"
          test -f "$SOURCE_DIR/src/game/FortressScene.tsx"
          test -f "$SOURCE_DIR/src/App.tsx"
      - name: Apply 0.10 combat update without changing the original archive
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/COMBAT-0.10-PATCH.diff"
          grep -q 'retaliationTargets' src/game/combatSystem.ts
      - name: Apply 0.11 army visual pack
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/VISUAL-0.11-PATCH.diff"
          grep -q 'function UnitVisual' src/game/UnitModels.tsx
          grep -q 'UnitVisual kind={unit.kind}' src/game/FortressScene.tsx
      - name: Install dependencies, test and build 0.11 web game
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test
          npm run build
          test -f dist/index.html
      - name: Package 0.11 source archive
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          zip -qr "$RUNNER_TEMP/IRON-FRONT-0.11-VISUAL-SOURCE.zip" . -x 'node_modules/*' 'dist/*' 'android/*'
          test -s "$RUNNER_TEMP/IRON-FRONT-0.11-VISUAL-SOURCE.zip"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create temporary Android wrapper outside repository
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "IRON FRONT 0.11" "com.yarubdoktor.ironfront011" --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK output
        run: |
          APK="$SOURCE_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          cp "$APK" "$RUNNER_TEMP/IRON-FRONT-0.11-VISUAL-TEST.apk"
      - name: Upload 0.11 visual test APK
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-0.11-VISUAL-APK
          path: \${{ runner.temp }}/IRON-FRONT-0.11-VISUAL-TEST.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload 0.11 visual source archive
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-0.11-VISUAL-SOURCE
          path: \${{ runner.temp }}/IRON-FRONT-0.11-VISUAL-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
