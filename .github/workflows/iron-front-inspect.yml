name: Inspect IRON FRONT 0.9 source
on:
  push:
    paths:
      - '.github/workflows/iron-front-inspect.yml'
      - 'IRON-FRONT-0.9-SOURCE.zip'
      - 'IRON-FRONT-0.8-Ready.zip'
  workflow_dispatch:
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate and inventory source archives
        run: |
          set -e
          mkdir -p inspection
          for archive in IRON-FRONT-0.9-SOURCE.zip IRON-FRONT-0.8-Ready.zip; do
            echo "===== $archive =====" | tee -a inspection/source-report.txt
            if [ ! -f "$archive" ]; then echo "MISSING ARCHIVE" | tee -a inspection/source-report.txt; continue; fi
            stat -c 'Size: %s bytes' "$archive" | tee -a inspection/source-report.txt
            if unzip -t "$archive" >> inspection/source-report.txt 2>&1; then echo "ZIP integrity: PASS" | tee -a inspection/source-report.txt; else echo "ZIP integrity: FAIL" | tee -a inspection/source-report.txt; exit 1; fi
            echo "File count: $(unzip -Z1 "$archive" | wc -l)" | tee -a inspection/source-report.txt
            echo "Top-level inventory:" | tee -a inspection/source-report.txt
            unzip -Z1 "$archive" | head -n 160 | tee -a inspection/source-report.txt
            echo "Important project files:" | tee -a inspection/source-report.txt
            unzip -Z1 "$archive" | grep -Ei '(^|/)(package\.json|package-lock\.json|index\.html|vite\.config\.|src/|public/|assets/|android/|capacitor\.config\.|README|CHANGELOG)' | head -n 160 | tee -a inspection/source-report.txt || true
            echo "" | tee -a inspection/source-report.txt
          done
          mkdir -p inspection/v08 inspection/v09
          unzip -q IRON-FRONT-0.8-Ready.zip -d inspection/v08
          unzip -q IRON-FRONT-0.9-SOURCE.zip -d inspection/v09
          echo "===== Detected root project markers =====" | tee -a inspection/source-report.txt
          find inspection/v08 inspection/v09 -type f \( -name package.json -o -name index.html -o -name vite.config.js -o -name vite.config.ts -o -name README.md \) | sort | tee -a inspection/source-report.txt
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-0.9-Source-Inspection
          path: inspection/source-report.txt
          if-no-files-found: error
          retention-days: 14
