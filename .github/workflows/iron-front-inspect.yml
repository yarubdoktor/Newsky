name: Build IRON FRONT 0.14 Battlefield Immersion APK
on:
  push:
    paths:
      - '.github/workflows/iron-front-inspect.yml'
      - 'IRON-FRONT-0.9-SOURCE.zip'
      - 'COMBAT-0.10-PATCH.diff'
      - 'VISUAL-0.11-PATCH.diff'
      - 'VISUAL-0.12-GLB-PATCH.diff'
      - 'VISUAL-0.13-A-PATCH.diff'
      - 'VISUAL-0.13-B1-PATCH.diff'
      - 'VISUAL-0.13-B2-PATCH.diff'
      - 'VISUAL-COMBAT-0.14-U0-PATCH.diff'
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract original 0.9 source only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iron-front-09"
          unzip -t "IRON-FRONT-0.9-SOURCE.zip"
          unzip -q "IRON-FRONT-0.9-SOURCE.zip" -d "$RUNNER_TEMP/iron-front-09"
          PACKAGE_JSON="$(find "$RUNNER_TEMP/iron-front-09" -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo 'ERROR: package.json not found in 0.9 source archive'
            find "$RUNNER_TEMP/iron-front-09" -maxdepth 4 -type f | head -n 120
            exit 1
          fi
          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Building from untouched 0.9 source: $SOURCE_DIR"
          test -f "$SOURCE_DIR/src/game/FortressScene.tsx"
          test -f "$SOURCE_DIR/src/App.tsx"
      - name: Apply 0.10 combat update without changing the original archive
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/COMBAT-0.10-PATCH.diff"
          grep -q 'retaliationTargets' src/game/combatSystem.ts
      - name: Apply 0.11 procedural army visual pack
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/VISUAL-0.11-PATCH.diff"
          grep -q 'function UnitVisual' src/game/UnitModels.tsx
          grep -q 'UnitVisual kind={unit.kind}' src/game/FortressScene.tsx
      - name: Apply 0.12 imported GLB vehicle models
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/VISUAL-0.12-GLB-PATCH.diff"
          grep -q 'useGLTF' src/game/UnitModels.tsx
          grep -q 'main-battle-tank.glb' src/game/UnitModels.tsx
      - name: Download and validate 0.12 CC0 vehicle models
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash tools/fetch-3dassets-pack.sh
          test "$(find public/assets/3d/vehicles -type f -name '*.glb' | wc -l)" -eq 5
      - name: Apply 0.13 base, fortification and nature model integration
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/VISUAL-0.13-A-PATCH.diff"
          patch -p1 < "$GITHUB_WORKSPACE/VISUAL-0.13-B1-PATCH.diff"
          patch -p1 < "$GITHUB_WORKSPACE/VISUAL-0.13-B2-PATCH.diff"
          grep -q 'STRUCTURE_MODELS' src/game/FortressScene.tsx
          grep -q 'InstancedNature' src/game/FortressScene.tsx
          grep -q 'BaseDressing' src/game/FortressScene.tsx
          grep -q 'light-tank.glb' src/game/UnitModels.tsx
          patch -p1 < "$GITHUB_WORKSPACE/VISUAL-COMBAT-0.14-PATCH.diff"
          grep -q 'threatHits' src/game/combatSystem.ts
          grep -q 'BattlefieldDetails' src/game/FortressScene.tsx
      - name: Download and validate all 0.13 CC0 world assets
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash tools/fetch-iron013-assets.sh
          BASE_COUNT="$(find public/assets/3d/base -type f -name '*.glb' | wc -l)"
          NATURE_COUNT="$(find public/assets/3d/nature -type f -name '*.glb' | wc -l)"
          VEHICLE_COUNT="$(find public/assets/3d/vehicles -type f -name '*.glb' | wc -l)"
          echo "Base assets: $BASE_COUNT / 25"
          echo "Nature assets: $NATURE_COUNT / 3"
          echo "Vehicle assets: $VEHICLE_COUNT / 7"
          test "$BASE_COUNT" -eq 25
          test "$NATURE_COUNT" -eq 3
          test "$VEHICLE_COUNT" -eq 7
          find public/assets/3d -type f -name '*.glb' -printf '%p %s bytes\n'
      - name: Install dependencies, test and build 0.14 web game
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test
          npm run build
          test -f dist/index.html
          test "$(find public/assets/3d -type f -name '*.glb' | wc -l)" -eq 35
      - name: Package 0.14 source archive with all GLB assets
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          zip -qr "$RUNNER_TEMP/IRON-FRONT-0.14-BATTLEFIELD-SOURCE.zip" . -x 'node_modules/*' 'dist/*' 'android/*'
          test -s "$RUNNER_TEMP/IRON-FRONT-0.14-BATTLEFIELD-SOURCE.zip"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create temporary Android wrapper outside repository
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "IRON FRONT 0.14" "com.yarubdoktor.ironfront014" --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK output
        run: |
          set -euo pipefail
          APK="$SOURCE_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          cp "$APK" "$RUNNER_TEMP/IRON-FRONT-0.14-BATTLEFIELD-TEST.apk"
          test -s "$RUNNER_TEMP/IRON-FRONT-0.14-BATTLEFIELD-TEST.apk"
      - name: Upload 0.14 battlefield immersion test APK
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-0.14-BATTLEFIELD-APK
          path: ${{ runner.temp }}/IRON-FRONT-0.14-BATTLEFIELD-TEST.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload 0.14 source archive with all models
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-0.14-BATTLEFIELD-SOURCE
          path: ${{ runner.temp }}/IRON-FRONT-0.14-BATTLEFIELD-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
